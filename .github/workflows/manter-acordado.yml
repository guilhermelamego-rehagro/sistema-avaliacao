# Mantém o app Streamlit Cloud "acordado" (e opcionalmente o Supabase).
# Roda a cada 8 horas (UTC). Atraso de alguns minutos é normal no GitHub Actions.
#
# Limite: se o app JÁ estiver sleeping, o ping NÃO clica em "acordar" —
# aí é preciso abrir a URL no navegador uma vez. Com uso/pings periódicos
# na janela de avaliações, costuma bastar para não cair no sleep.

name: Manter app acordado

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch: # rodar manualmente em Actions → Run workflow

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit Cloud
        env:
          APP_URL: https://avaliacao-gga.streamlit.app
        run: |
          set -e
          echo "GET $APP_URL (sem seguir redirects)"
          # NÃO usar -L: o Cloud responde 303 e, sem cookie jar de browser,
          # seguir redirects gera loop (curl 47 / max redirects).
          # Para keep-awake, basta o edge responder 2xx/3xx (= tráfego chegou).
          code=$(curl -sS --max-redirs 0 -o /tmp/st_body.html \
            -w "%{http_code}" \
            -A "Rehagro-keep-awake/1.0 (GitHub Actions)" \
            --max-time 90 \
            "$APP_URL" || true)
          echo "HTTP $code"
          if [ -f /tmp/st_body.html ] && grep -qiE "sleeping|get this app back up" /tmp/st_body.html; then
            echo "::warning::App parece SLEEPING — abra a URL e acorde manualmente uma vez."
            exit 1
          fi
          case "$code" in
            2??|3??)
              echo "OK — Cloud respondeu HTTP $code (tráfego registrado)."
              ;;
            *)
              echo "::warning::Resposta inesperada HTTP $code"
              exit 1
              ;;
          esac

      - name: Ping Supabase (opcional)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL / SUPABASE_ANON_KEY não definidos — pulando Supabase."
            exit 0
          fi
          set -e
          code=$(curl -sS -o /tmp/sb.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --max-time 30 \
            "${SUPABASE_URL}/rest/v1/perfis_usuario?select=id&limit=1")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Supabase HTTP $code"
            cat /tmp/sb.json || true
            exit 1
          fi
          echo "OK — Supabase respondeu."
